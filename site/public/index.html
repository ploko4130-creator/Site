<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brilhante Scann</title>
<style>
:root{--bg:#2b3a67;--card:#232f55;--bar:#12121f;--tx:#eef0f7;--mut:#9aa6c8;--ok:#5fd68a;--warn:#f0b840;--bad:#ef5b5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(560px,100%);background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px #0005}
.card>i{display:block;height:22px;background:var(--bar)}.in{padding:32px}
h1{margin:0 0 4px;letter-spacing:.35em;font-size:22px;text-align:center}.sub{text-align:center;color:var(--mut);margin:0 0 24px}
button,.btn{display:block;width:100%;padding:13px;border:0;border-radius:24px;background:var(--tx);color:var(--bar);font:700 15px inherit;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}
button.g{background:#ffffff14;color:var(--tx)}input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff0d;color:var(--tx);font:inherit;margin-top:8px}
.code{display:flex;gap:8px;justify-content:center;margin:18px 0}.code b{width:44px;height:54px;display:grid;place-items:center;background:#ffffff12;border-radius:8px;font-size:26px}
.bar{height:20px;border-radius:12px;background:#ffffff12;overflow:hidden;margin:16px 0}.bar div{height:100%;width:40%;background:var(--tx);border-radius:12px;animation:s 1.6s ease-in-out infinite alternate}@keyframes s{to{width:95%}}
.hide{display:none}.mut{color:var(--mut);font-size:13px;text-align:center}
.v{text-align:center;font-size:24px;font-weight:700;margin:6px 0}.BANIR{color:var(--bad)}.AVALIAR{color:var(--warn)}.NAOBANIR{color:var(--ok)}
.cnt{display:flex;justify-content:space-around;margin:14px 0}.cnt div{text-align:center}.cnt b{display:block;font-size:22px}
.f{max-height:260px;overflow:auto;font-size:13px;background:#0003;border-radius:8px;padding:8px 12px}.f p{margin:6px 0;border-bottom:1px solid #ffffff10;padding-bottom:6px;word-break:break-word}
.Critico{color:var(--bad)}.Suspeito{color:var(--warn)}
</style></head><body><div class="card"><i></i><div class="in">

<div id="home"><h1>BRILHANTE</h1><p class="sub">Scanner anti-cheat para FiveM</p>
<a class="btn" href="/download">Baixar o Scann (.bat)</a>
<button class="g" onclick="show('staff')">Área da staff</button>
<p class="mut" style="margin-top:18px">Jogador: baixe, execute e digite o código de 6 dígitos que a staff te passar.</p></div>

<div id="staff" class="hide"><h1>STAFF</h1><p class="sub">Gere um código e acompanhe o resultado</p>
<input id="key" type="password" placeholder="Senha da staff"><input id="pl" placeholder="Nome/ID do jogador (opcional)">
<button onclick="gen()">Gerar código</button><p id="err" class="mut"></p>
<div id="hist"></div><button class="g" onclick="show('home')">Voltar</button></div>

<div id="wait" class="hide"><h1>CÓDIGO</h1><div class="code" id="digits"></div>
<p class="mut" id="st">Aguardando o jogador abrir o scanner…</p><div class="bar"><div></div></div>
<button class="g" onclick="stop();show('staff');list()">Voltar</button></div>

<div id="res" class="hide"><div class="v" id="niv"></div><p class="mut" id="mot"></p><div class="cnt" id="cnt"></div>
<div class="f" id="ach"></div><p class="mut" id="pc"></p><button class="g" onclick="show('staff');list()">Voltar</button></div>

</div></div><script>
const $=id=>document.getElementById(id);let t,K=()=>({'x-admin-key':$('key').value,'Content-Type':'application/json'});
const show=id=>['home','staff','wait','res'].forEach(x=>$(x).classList.toggle('hide',x!==id));
const stop=()=>clearInterval(t),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function gen(){const r=await fetch('/api/codes',{method:'POST',headers:K(),body:JSON.stringify({jogador:$('pl').value})});
 if(!r.ok){$('err').textContent='Senha incorreta.';return}$('err').textContent='';const{code}=await r.json();watch(code)}
function watch(code){show('wait');$('digits').innerHTML=[...code].map(d=>`<b>${d}</b>`).join('');
 const S={aguardando:'Aguardando o jogador abrir o scanner…',rodando:'Scanning processes…'};
 const poll=async()=>{const c=await(await fetch('/api/codes/'+code,{headers:K()})).json();
  if(c.status==='concluido'){stop();open_(c)}else $('st').textContent=S[c.status]||''};poll();t=setInterval(poll,2500)}
function open_(c){const r=c.result||{},n=r.contagem||{};show('res');
 $('niv').textContent=r.nivel;$('niv').className='v '+String(r.nivel).replace(/\s/g,'');$('mot').textContent=r.motivo||'';
 $('cnt').innerHTML=[['Crítico','critico'],['Suspeito','suspeito'],['Atenção','atencao'],['OK','ok']].map(([a,k])=>`<div><b>${n[k]??0}</b><span class="mut">${a}</span></div>`).join('');
 $('ach').innerHTML=(r.achados||[]).map(a=>`<p><b class="${a.nivel}">[${esc(a.nivel)}]</b> ${esc(a.secao)} – ${esc(a.tag)}: ${esc(a.msg)}</p>`).join('')||'<p>Nenhum item crítico ou suspeito.</p>';
 $('pc').textContent='PC: '+(r.pc||'?')+(c.jogador?' · Jogador: '+c.jogador:'')}
async function list(){const r=await fetch('/api/codes',{headers:K()});if(!r.ok)return;const a=await r.json();
 $('hist').innerHTML=a.slice(0,8).map(x=>`<button class="g" onclick="watch('${x.code}')">${x.code} · ${esc(x.jogador||'—')} · ${x.status}${x.nivel?' · '+esc(x.nivel):''}</button>`).join('')}
</script></body></html>
